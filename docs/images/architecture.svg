<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">FraudLens system architecture</title><desc id="desc">Browser UI sends authenticated transactions to FastAPI, which validates and scores them with a synthetic-data Isolation Forest and returns an illustrative score. SQLite stores demo accounts.</desc>
<defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#192947"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa7ff"/></marker></defs>
<rect width="1200" height="520" rx="26" fill="#0b1020"/><text x="60" y="64" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#eef3ff">FraudLens · System architecture</text><text x="60" y="94" font-family="Arial,sans-serif" font-size="14" fill="#9eabc4">A small educational anomaly-scoring application</text>
<g font-family="Arial,sans-serif"><rect x="55" y="180" width="220" height="145" rx="18" fill="url(#panel)" stroke="#435a83" stroke-width="2"/><text x="165" y="220" text-anchor="middle" font-size="20" font-weight="700" fill="#eef3ff">Browser UI</text><text x="165" y="250" text-anchor="middle" font-size="13" fill="#b9c8e4">HTML · CSS · JS</text><text x="165" y="277" text-anchor="middle" font-size="12" fill="#9eabc4">Register / login</text><text x="165" y="298" text-anchor="middle" font-size="12" fill="#9eabc4">Transaction form</text>
<rect x="355" y="180" width="220" height="145" rx="18" fill="url(#panel)" stroke="#435a83" stroke-width="2"/><text x="465" y="220" text-anchor="middle" font-size="20" font-weight="700" fill="#eef3ff">FastAPI</text><text x="465" y="250" text-anchor="middle" font-size="13" fill="#b9c8e4">Pydantic validation</text><text x="465" y="277" text-anchor="middle" font-size="12" fill="#9eabc4">Bearer token check</text><text x="465" y="298" text-anchor="middle" font-size="12" fill="#9eabc4">REST endpoints</text>
<rect x="655" y="180" width="220" height="145" rx="18" fill="url(#panel)" stroke="#435a83" stroke-width="2"/><text x="765" y="220" text-anchor="middle" font-size="20" font-weight="700" fill="#eef3ff">ML Scorer</text><text x="765" y="250" text-anchor="middle" font-size="13" fill="#b9c8e4">Isolation Forest</text><text x="765" y="277" text-anchor="middle" font-size="12" fill="#9eabc4">Synthetic training data</text><text x="765" y="298" text-anchor="middle" font-size="12" fill="#9eabc4">Heuristic risk bands</text>
<rect x="955" y="180" width="190" height="145" rx="18" fill="url(#panel)" stroke="#435a83" stroke-width="2"/><text x="1050" y="220" text-anchor="middle" font-size="20" font-weight="700" fill="#eef3ff">Result</text><text x="1050" y="250" text-anchor="middle" font-size="13" fill="#b9c8e4">Risk score + label</text><text x="1050" y="277" text-anchor="middle" font-size="12" fill="#9eabc4">Approve / review</text><text x="1050" y="298" text-anchor="middle" font-size="12" fill="#9eabc4">Demo only</text>
<path d="M275 250 H348" stroke="#8aa7ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M575 250 H648" stroke="#8aa7ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M875 250 H948" stroke="#8aa7ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="355" y="370" width="220" height="80" rx="14" fill="#182c2a" stroke="#3a8b78" stroke-width="2"/><text x="465" y="401" text-anchor="middle" font-size="16" font-weight="700" fill="#dffcf2">SQLite</text><text x="465" y="425" text-anchor="middle" font-size="12" fill="#a9dccc">Demo user accounts</text><path d="M465 325 V362" stroke="#69c7b0" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="655" y="370" width="490" height="80" rx="14" fill="#30251a" stroke="#8b6839" stroke-width="2"/><text x="900" y="401" text-anchor="middle" font-size="16" font-weight="700" fill="#ffe5b1">Important limitation</text><text x="900" y="425" text-anchor="middle" font-size="12" fill="#e6c99b">Synthetic data · Not calibrated · Not for real financial decisions</text>
<text x="60" y="485" font-family="Arial,sans-serif" font-size="12" fill="#7183a4">Diagram is conceptual. Model validation on approved real-world benchmark data is future work.</text></g></svg>