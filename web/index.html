<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fraud Detection</title><style>body{font-family:Inter,Arial;max-width:900px;margin:40px auto;padding:20px;background:#f6f7fb}main{background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001}input,button{padding:12px;margin:6px;border:1px solid #ddd;border-radius:10px}button{cursor:pointer}.result{margin-top:20px;padding:18px;border-radius:12px;background:#f1f5f9}</style></head><body><main><h1>Fraud Detection System</h1><p>Transaction risk scoring dashboard</p><div><input id="amount" type="number" placeholder="Amount" value="1200"><input id="age" type="number" placeholder="Account age days" value="60"><input id="velocity" type="number" placeholder="24h velocity" value="2"><input id="distance" type="number" placeholder="Distance km" value="50"><label><input id="foreign" type="checkbox"> Foreign</label><button onclick="predict()">Analyze Risk</button></div><div id="out" class="result">Enter transaction data.</div></main><script>async function predict(){let b={amount:+amount.value,account_age_days:+age.value,velocity_24h:+velocity.value,distance_km:+distance.value,foreign:foreign.checked};let r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});out.innerHTML='<pre>'+JSON.stringify(await r.json(),null,2)+'</pre>'}</script></body></html>
